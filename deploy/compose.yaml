name: farda

x-build-args: &build-args
  BUILD_VERSION: ${BUILD_VERSION:-dev}
  VCS_REF: ${VCS_REF:-unknown}
  BUILD_DATE: ${BUILD_DATE:-unknown}

x-farda-environment: &farda-environment
  NODE_ENV: production
  HOST: 0.0.0.0
  PORT: 8000
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env}
  BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?Set BETTER_AUTH_SECRET in deploy/.env}
  BETTER_AUTH_URL: ${BETTER_AUTH_URL:?Set BETTER_AUTH_URL in deploy/.env}
  FARDA_REFILL_AI_ENABLED: "false"
  FARDA_REFILL_PROVIDER_ENABLED: "false"

x-vial-environment: &vial-environment
  NODE_ENV: production
  PORT: 5000
  MONGODB_URI: ${MONGODB_URI:?Set MONGODB_URI in deploy/.env}
  DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env}
  CORS_ORIGINS: ${CORS_ORIGINS:?Set CORS_ORIGINS in deploy/.env}

services:
  farda-migrate:
    build:
      context: ../farda-app-backend
      target: migration
      args: *build-args
    environment:
      NODE_ENV: production
      DATABASE_URL: ${MIGRATION_DATABASE_URL:?Set MIGRATION_DATABASE_URL in deploy/.env}
    restart: "no"

  vial-prepare:
    build:
      context: ../smart-vial-backend
      target: runtime
      args: *build-args
    command: ["node", "scripts/prepare-database.js"]
    environment:
      NODE_ENV: production
      MONGODB_URI: ${MONGODB_PREPARE_URI:?Set MONGODB_PREPARE_URI in deploy/.env}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in deploy/.env}
    depends_on:
      farda-migrate:
        condition: service_completed_successfully
    restart: "no"

  farda-api:
    build:
      context: ../farda-app-backend
      target: runtime
      args: *build-args
    environment: *farda-environment
    init: true
    ports:
      - "127.0.0.1:${FARDA_API_PORT:-8000}:8000"
    depends_on:
      farda-migrate:
        condition: service_completed_successfully
    restart: unless-stopped

  smart-vial-api:
    build:
      context: ../smart-vial-backend
      target: runtime
      args: *build-args
    environment: *vial-environment
    init: true
    ports:
      - "127.0.0.1:${SMART_VIAL_API_PORT:-5000}:5000"
    depends_on:
      farda-migrate:
        condition: service_completed_successfully
      vial-prepare:
        condition: service_completed_successfully
    restart: unless-stopped
