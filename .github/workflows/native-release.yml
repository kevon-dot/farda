name: Native release archives

on:
  workflow_dispatch:
    inputs:
      release_commit:
        description: Full 40-character commit SHA already merged to the default branch
        required: true
        type: string
      version_name:
        description: Store version name, for example 1.2.0
        required: true
        type: string
      build_number:
        description: Positive, monotonically increasing Android versionCode and iOS CFBundleVersion
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: native-release-${{ inputs.release_commit }}-${{ inputs.build_number }}
  cancel-in-progress: false

jobs:
  source-gate:
    name: Pin approved source
    runs-on: ubuntu-latest
    outputs:
      release_sha: ${{ steps.source.outputs.release_sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_commit }}
          fetch-depth: 0
      - name: Verify immutable source and release identifiers
        id: source
        env:
          REQUESTED_SHA: ${{ inputs.release_commit }}
          VERSION_NAME: ${{ inputs.version_name }}
          BUILD_NUMBER: ${{ inputs.build_number }}
          DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
        run: |
          set -euo pipefail
          [[ "$REQUESTED_SHA" =~ ^[0-9a-f]{40}$ ]] || { echo "release_commit must be a full lowercase SHA" >&2; exit 1; }
          [[ "$VERSION_NAME" =~ ^[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.-]+)?$ ]] || { echo "version_name must be an explicit store version" >&2; exit 1; }
          [[ "$BUILD_NUMBER" =~ ^[1-9][0-9]*$ ]] || { echo "build_number must be a positive integer" >&2; exit 1; }
          (( BUILD_NUMBER <= 2147483647 )) || { echo "build_number exceeds the native platform limit" >&2; exit 1; }
          ACTUAL_SHA="$(git rev-parse HEAD)"
          [[ "$ACTUAL_SHA" == "$REQUESTED_SHA" ]] || { echo "checkout does not match requested commit" >&2; exit 1; }
          git fetch --no-tags origin "$DEFAULT_BRANCH"
          git merge-base --is-ancestor "$ACTUAL_SHA" FETCH_HEAD || { echo "release commit is not merged to the default branch" >&2; exit 1; }
          [[ -z "$(git status --porcelain)" ]] || { echo "release checkout is dirty" >&2; exit 1; }
          echo "release_sha=$ACTUAL_SHA" >> "$GITHUB_OUTPUT"

  android-aab:
    name: Signed Android App Bundle
    needs: source-gate
    runs-on: ubuntu-latest
    environment: native-release
    defaults:
      run:
        working-directory: farda-app
    env:
      FARDA_RELEASE_COMMIT: ${{ needs.source-gate.outputs.release_sha }}
      FARDA_BUILD_NUMBER: ${{ inputs.build_number }}
      FARDA_VERSION_NAME: ${{ inputs.version_name }}
      FARDA_ANDROID_APPLICATION_ID: ${{ vars.FARDA_ANDROID_APPLICATION_ID }}
      FARDA_ANDROID_CERT_SHA256: ${{ vars.FARDA_ANDROID_CERT_SHA256 }}
      FARDA_ANDROID_KEY_ALIAS: ${{ secrets.FARDA_ANDROID_KEY_ALIAS }}
      FARDA_ANDROID_KEY_PASSWORD: ${{ secrets.FARDA_ANDROID_KEY_PASSWORD }}
      FARDA_ANDROID_KEYSTORE_PASSWORD: ${{ secrets.FARDA_ANDROID_KEYSTORE_PASSWORD }}
      FARDA_ANDROID_KEYSTORE_BASE64: ${{ secrets.FARDA_ANDROID_KEYSTORE_BASE64 }}
      FARDA_BASE_API_URL: ${{ vars.FARDA_BASE_API_URL }}
      FARDA_VIAL_API_URL: ${{ vars.FARDA_VIAL_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-gate.outputs.release_sha }}
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Require external Android release inputs
        run: |
          set -euo pipefail
          required=(FARDA_ANDROID_APPLICATION_ID FARDA_ANDROID_CERT_SHA256 FARDA_ANDROID_KEY_ALIAS FARDA_ANDROID_KEY_PASSWORD FARDA_ANDROID_KEYSTORE_PASSWORD FARDA_ANDROID_KEYSTORE_BASE64 FARDA_BASE_API_URL FARDA_VIAL_API_URL)
          for name in "${required[@]}"; do [[ -n "${!name:-}" ]] || { echo "Missing external release setting: $name" >&2; exit 1; }; done
          [[ "$FARDA_ANDROID_APPLICATION_ID" != com.example.* ]] || { echo "Placeholder Android application ID refused" >&2; exit 1; }
          [[ "$FARDA_ANDROID_CERT_SHA256" =~ ^([0-9A-Fa-f]{2}:?){32}$ ]] || { echo "Invalid expected Android certificate SHA-256" >&2; exit 1; }
          [[ "$FARDA_BASE_API_URL" == https://* && "$FARDA_BASE_API_URL" != *example.com* ]] || { echo "Production API URL must be non-placeholder HTTPS" >&2; exit 1; }
          [[ "$FARDA_VIAL_API_URL" == https://* && "$FARDA_VIAL_API_URL" != *example.com* ]] || { echo "Vial API URL must be non-placeholder HTTPS" >&2; exit 1; }
      - name: Materialize ephemeral signing and public app configuration
        run: |
          set -euo pipefail
          umask 077
          export FARDA_ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/farda-release.jks"
          printf '%s' "$FARDA_ANDROID_KEYSTORE_BASE64" | base64 --decode > "$FARDA_ANDROID_KEYSTORE_PATH"
          [[ -s "$FARDA_ANDROID_KEYSTORE_PATH" ]] || { echo "Decoded Android keystore is empty" >&2; exit 1; }
          echo "FARDA_ANDROID_KEYSTORE_PATH=$FARDA_ANDROID_KEYSTORE_PATH" >> "$GITHUB_ENV"
          for file in .env.development .env.staging .env.production; do
            printf 'BASE_API_URL=%s\nVIAL_API_URL=%s\n' "$FARDA_BASE_API_URL" "$FARDA_VIAL_API_URL" > "$file"
          done
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build signed production AAB
        run: >-
          flutter build appbundle --release
          --build-name="$FARDA_VERSION_NAME"
          --build-number="$FARDA_BUILD_NUMBER"
          --dart-define=ENV=production
          --dart-define=BASE_API_URL="$FARDA_BASE_API_URL"
          --dart-define=VIAL_API_URL="$FARDA_VIAL_API_URL"
      - name: Verify bundle signature and embedded provenance
        run: |
          set -euo pipefail
          AAB=build/app/outputs/bundle/release/app-release.aab
          [[ -s "$AAB" ]] || { echo "Release AAB missing" >&2; exit 1; }
          jarsigner -verify "$AAB"
          ACTUAL_CERT="$(keytool -printcert -jarfile "$AAB" | sed -n 's/^[[:space:]]*SHA256:[[:space:]]*//p' | head -1 | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          EXPECTED_CERT="$(printf '%s' "$FARDA_ANDROID_CERT_SHA256" | tr -d ': ' | tr '[:lower:]' '[:upper:]')"
          [[ -n "$ACTUAL_CERT" && "$ACTUAL_CERT" == "$EXPECTED_CERT" ]] || { echo "AAB signer fingerprint does not match the approved upload certificate" >&2; exit 1; }
          unzip -p "$AAB" base/manifest/AndroidManifest.xml > "$RUNNER_TEMP/android-release-manifest.pb"
          PROVENANCE="git=$FARDA_RELEASE_COMMIT;build=$FARDA_BUILD_NUMBER"
          grep -aFq "$PROVENANCE" "$RUNNER_TEMP/android-release-manifest.pb" || { echo "AAB does not contain exact release provenance" >&2; exit 1; }
          grep -aFq "$FARDA_ANDROID_APPLICATION_ID" "$RUNNER_TEMP/android-release-manifest.pb" || { echo "AAB does not contain the approved application ID" >&2; exit 1; }
          mkdir -p build/release-evidence
          AAB_SHA256="$(sha256sum "$AAB" | cut -d' ' -f1)"
          export AAB_SHA256 ACTUAL_CERT
          python3 - <<'PY'
          import json, os
          from pathlib import Path
          evidence = {
              "artifact": "app-release.aab",
              "artifactSha256": os.environ["AAB_SHA256"],
              "buildNumber": os.environ["FARDA_BUILD_NUMBER"],
              "certificateSha256": os.environ["ACTUAL_CERT"],
              "commit": os.environ["FARDA_RELEASE_COMMIT"],
              "packageId": os.environ["FARDA_ANDROID_APPLICATION_ID"],
              "versionName": os.environ["FARDA_VERSION_NAME"],
          }
          Path("build/release-evidence/android.json").write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: farda-android-${{ needs.source-gate.outputs.release_sha }}-${{ inputs.build_number }}
          path: |
            farda-app/build/app/outputs/bundle/release/app-release.aab
            farda-app/build/release-evidence/android.json
          if-no-files-found: error
          retention-days: 14

  ios-archive:
    name: Signed iOS archive and IPA
    needs: source-gate
    runs-on: macos-15
    environment: native-release
    defaults:
      run:
        working-directory: farda-app
    env:
      FARDA_RELEASE_COMMIT: ${{ needs.source-gate.outputs.release_sha }}
      FARDA_BUILD_NUMBER: ${{ inputs.build_number }}
      FARDA_VERSION_NAME: ${{ inputs.version_name }}
      FARDA_IOS_APP_BUNDLE_ID: ${{ vars.FARDA_IOS_APP_BUNDLE_ID }}
      FARDA_IOS_EXTENSION_BUNDLE_ID: ${{ vars.FARDA_IOS_EXTENSION_BUNDLE_ID }}
      FARDA_IOS_TEAM_ID: ${{ vars.FARDA_IOS_TEAM_ID }}
      FARDA_IOS_APP_PROFILE: ${{ vars.FARDA_IOS_APP_PROFILE }}
      FARDA_IOS_EXTENSION_PROFILE: ${{ vars.FARDA_IOS_EXTENSION_PROFILE }}
      FARDA_IOS_EXPORT_METHOD: ${{ vars.FARDA_IOS_EXPORT_METHOD }}
      FARDA_IOS_CERT_SHA256: ${{ vars.FARDA_IOS_CERT_SHA256 }}
      FARDA_IOS_CERTIFICATE_BASE64: ${{ secrets.FARDA_IOS_CERTIFICATE_BASE64 }}
      FARDA_IOS_CERTIFICATE_PASSWORD: ${{ secrets.FARDA_IOS_CERTIFICATE_PASSWORD }}
      FARDA_IOS_APP_PROFILE_BASE64: ${{ secrets.FARDA_IOS_APP_PROFILE_BASE64 }}
      FARDA_IOS_EXTENSION_PROFILE_BASE64: ${{ secrets.FARDA_IOS_EXTENSION_PROFILE_BASE64 }}
      FARDA_BASE_API_URL: ${{ vars.FARDA_BASE_API_URL }}
      FARDA_VIAL_API_URL: ${{ vars.FARDA_VIAL_API_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.source-gate.outputs.release_sha }}
          fetch-depth: 1
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Require external iOS release inputs
        run: |
          set -euo pipefail
          required=(FARDA_IOS_APP_BUNDLE_ID FARDA_IOS_EXTENSION_BUNDLE_ID FARDA_IOS_TEAM_ID FARDA_IOS_APP_PROFILE FARDA_IOS_EXTENSION_PROFILE FARDA_IOS_EXPORT_METHOD FARDA_IOS_CERT_SHA256 FARDA_IOS_CERTIFICATE_BASE64 FARDA_IOS_CERTIFICATE_PASSWORD FARDA_IOS_APP_PROFILE_BASE64 FARDA_IOS_EXTENSION_PROFILE_BASE64 FARDA_BASE_API_URL FARDA_VIAL_API_URL)
          for name in "${required[@]}"; do [[ -n "${!name:-}" ]] || { echo "Missing external release setting: $name" >&2; exit 1; }; done
          [[ "$FARDA_IOS_CERT_SHA256" =~ ^([0-9A-Fa-f]{2}:?){32}$ ]] || { echo "Invalid expected iOS certificate SHA-256" >&2; exit 1; }
          [[ "$FARDA_BASE_API_URL" == https://* && "$FARDA_BASE_API_URL" != *example.com* ]] || { echo "Production API URL must be non-placeholder HTTPS" >&2; exit 1; }
          [[ "$FARDA_VIAL_API_URL" == https://* && "$FARDA_VIAL_API_URL" != *example.com* ]] || { echo "Vial API URL must be non-placeholder HTTPS" >&2; exit 1; }
          python3 ios/scripts/configure_release.py --check
      - name: Install signing certificate and profiles
        run: |
          set -euo pipefail
          umask 077
          KEYCHAIN_PATH="$RUNNER_TEMP/farda-release.keychain-db"
          KEYCHAIN_PASSWORD="$(openssl rand -hex 24)"
          CERTIFICATE_PATH="$RUNNER_TEMP/farda-distribution.p12"
          printf '%s' "$FARDA_IOS_CERTIFICATE_BASE64" | base64 -D > "$CERTIFICATE_PATH"
          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security import "$CERTIFICATE_PATH" -k "$KEYCHAIN_PATH" -P "$FARDA_IOS_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH"
          security find-identity -v -p codesigning "$KEYCHAIN_PATH" | grep -q 'Apple Distribution'
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          printf '%s' "$FARDA_IOS_APP_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/app.mobileprovision"
          printf '%s' "$FARDA_IOS_EXTENSION_PROFILE_BASE64" | base64 -D > "$RUNNER_TEMP/extension.mobileprovision"
          security cms -D -i "$RUNNER_TEMP/app.mobileprovision" > "$RUNNER_TEMP/app-profile.plist"
          security cms -D -i "$RUNNER_TEMP/extension.mobileprovision" > "$RUNNER_TEMP/extension-profile.plist"
          python3 - <<'PY'
          import hashlib, os, plistlib
          from pathlib import Path
          expected_cert = os.environ["FARDA_IOS_CERT_SHA256"].replace(":", "").upper()
          profiles = (
              ("app", os.environ["FARDA_IOS_APP_BUNDLE_ID"], os.environ["FARDA_IOS_APP_PROFILE"], True),
              ("extension", os.environ["FARDA_IOS_EXTENSION_BUNDLE_ID"], os.environ["FARDA_IOS_EXTENSION_PROFILE"], False),
          )
          for kind, bundle_id, expected_name, needs_push in profiles:
              profile = plistlib.loads(Path(os.environ["RUNNER_TEMP"], f"{kind}-profile.plist").read_bytes())
              if profile["Name"] != expected_name:
                  raise SystemExit(f"{kind} profile name mismatch")
              if os.environ["FARDA_IOS_TEAM_ID"] not in profile["TeamIdentifier"]:
                  raise SystemExit(f"{kind} profile team mismatch")
              application_id = profile["Entitlements"]["application-identifier"]
              if not application_id.endswith("." + bundle_id):
                  raise SystemExit(f"{kind} profile bundle ID mismatch")
              if needs_push and profile["Entitlements"].get("aps-environment") != "production":
                  raise SystemExit("app profile lacks production APNs entitlement")
              fingerprints = {hashlib.sha256(certificate).hexdigest().upper() for certificate in profile["DeveloperCertificates"]}
              if expected_cert not in fingerprints:
                  raise SystemExit(f"{kind} profile does not contain the approved distribution certificate")
              destination = Path.home() / "Library/MobileDevice/Provisioning Profiles" / f"{profile['UUID']}.mobileprovision"
              destination.write_bytes(Path(os.environ["RUNNER_TEMP"], f"{kind}.mobileprovision").read_bytes())
          PY
          echo "FARDA_KEYCHAIN_PATH=$KEYCHAIN_PATH" >> "$GITHUB_ENV"
      - name: Materialize ephemeral release configuration
        run: |
          set -euo pipefail
          umask 077
          for file in .env.development .env.staging .env.production; do
            printf 'BASE_API_URL=%s\nVIAL_API_URL=%s\n' "$FARDA_BASE_API_URL" "$FARDA_VIAL_API_URL" > "$file"
          done
          python3 ios/scripts/configure_release.py \
            --xcconfig ios/Flutter/ReleaseSigning.xcconfig \
            --export-options "$RUNNER_TEMP/FardaExportOptions.plist"
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Build signed archive and export IPA
        run: >-
          flutter build ipa --release
          --build-name="$FARDA_VERSION_NAME"
          --build-number="$FARDA_BUILD_NUMBER"
          --export-options-plist="$RUNNER_TEMP/FardaExportOptions.plist"
          --dart-define=ENV=production
          --dart-define=BASE_API_URL="$FARDA_BASE_API_URL"
          --dart-define=VIAL_API_URL="$FARDA_VIAL_API_URL"
      - name: Verify exported signatures, entitlements and provenance
        run: |
          set -euo pipefail
          IPA="$(find build/ios/ipa -maxdepth 1 -name '*.ipa' -print -quit)"
          [[ -n "$IPA" && -s "$IPA" ]] || { echo "Exported IPA missing" >&2; exit 1; }
          PAYLOAD="$RUNNER_TEMP/ipa-payload"
          rm -rf "$PAYLOAD"
          mkdir -p "$PAYLOAD"
          unzip -q "$IPA" -d "$PAYLOAD"
          APP="$(find "$PAYLOAD/Payload" -maxdepth 1 -name '*.app' -type d -print -quit)"
          EXTENSION="$(find "$APP/PlugIns" -maxdepth 1 -name '*.appex' -type d -print -quit)"
          [[ -n "$APP" && -n "$EXTENSION" ]] || { echo "App or Live Activity extension missing from IPA" >&2; exit 1; }
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$EXTENSION"
          codesign -d --entitlements :- "$APP" > "$RUNNER_TEMP/app-entitlements.plist"
          codesign -d --entitlements :- "$EXTENSION" > "$RUNNER_TEMP/extension-entitlements.plist"
          security cms -D -i "$APP/embedded.mobileprovision" > "$RUNNER_TEMP/exported-app-profile.plist"
          security cms -D -i "$EXTENSION/embedded.mobileprovision" > "$RUNNER_TEMP/exported-extension-profile.plist"
          export FARDA_IPA_PATH="$IPA" FARDA_APP_PATH="$APP" FARDA_EXTENSION_PATH="$EXTENSION"
          python3 - <<'PY'
          import hashlib, json, os, plistlib
          from pathlib import Path
          app = Path(os.environ["FARDA_APP_PATH"])
          extension = Path(os.environ["FARDA_EXTENSION_PATH"])
          app_info = plistlib.loads((app / "Info.plist").read_bytes())
          extension_info = plistlib.loads((extension / "Info.plist").read_bytes())
          app_entitlements = plistlib.loads(Path(os.environ["RUNNER_TEMP"], "app-entitlements.plist").read_bytes())
          extension_entitlements = plistlib.loads(Path(os.environ["RUNNER_TEMP"], "extension-entitlements.plist").read_bytes())
          app_profile = plistlib.loads(Path(os.environ["RUNNER_TEMP"], "exported-app-profile.plist").read_bytes())
          extension_profile = plistlib.loads(Path(os.environ["RUNNER_TEMP"], "exported-extension-profile.plist").read_bytes())
          expected_cert = os.environ["FARDA_IOS_CERT_SHA256"].replace(":", "").upper()
          expected = {
              "app": os.environ["FARDA_IOS_APP_BUNDLE_ID"],
              "extension": os.environ["FARDA_IOS_EXTENSION_BUNDLE_ID"],
              "team": os.environ["FARDA_IOS_TEAM_ID"],
              "commit": os.environ["FARDA_RELEASE_COMMIT"],
              "build": os.environ["FARDA_BUILD_NUMBER"],
              "version": os.environ["FARDA_VERSION_NAME"],
          }
          for label, info, entitlements, bundle_id in (
              ("app", app_info, app_entitlements, expected["app"]),
              ("extension", extension_info, extension_entitlements, expected["extension"]),
          ):
              checks = (
                  (info["CFBundleIdentifier"] == bundle_id, "bundle ID"),
                  (info["CFBundleVersion"] == expected["build"], "build number"),
                  (info["CFBundleShortVersionString"] == expected["version"], "version"),
                  (info["FardaReleaseCommit"] == expected["commit"], "commit provenance"),
                  (entitlements["com.apple.developer.team-identifier"] == expected["team"], "signing team"),
                  (entitlements["application-identifier"].endswith("." + bundle_id), "application entitlement"),
              )
              for passed, field in checks:
                  if not passed:
                      raise SystemExit(f"{label} {field} mismatch")
          if app_entitlements["aps-environment"] != "production":
              raise SystemExit("production APNs entitlement missing")
          for label, profile in (("app", app_profile), ("extension", extension_profile)):
              fingerprints = {hashlib.sha256(certificate).hexdigest().upper() for certificate in profile["DeveloperCertificates"]}
              if expected_cert not in fingerprints:
                  raise SystemExit(f"exported {label} profile lacks the approved distribution certificate")
          ipa = Path(os.environ["FARDA_IPA_PATH"])
          evidence = {
              "appBundleId": expected["app"],
              "artifact": ipa.name,
              "artifactSha256": hashlib.sha256(ipa.read_bytes()).hexdigest(),
              "buildNumber": expected["build"],
              "certificateSha256": expected_cert,
              "commit": expected["commit"],
              "exportMethod": os.environ["FARDA_IOS_EXPORT_METHOD"],
              "extensionBundleId": expected["extension"],
              "teamId": expected["team"],
              "versionName": expected["version"],
          }
          output = Path("build/release-evidence/ios.json")
          output.parent.mkdir(parents=True, exist_ok=True)
          output.write_text(json.dumps(evidence, indent=2, sort_keys=True) + "\n")
          PY
      - name: Remove temporary signing material
        if: always()
        run: |
          security delete-keychain "$FARDA_KEYCHAIN_PATH" 2>/dev/null || true
          rm -f "$RUNNER_TEMP/farda-distribution.p12" "$RUNNER_TEMP"/*.mobileprovision "$RUNNER_TEMP"/*-profile.plist "$RUNNER_TEMP/FardaExportOptions.plist"
      - uses: actions/upload-artifact@v4
        with:
          name: farda-ios-${{ needs.source-gate.outputs.release_sha }}-${{ inputs.build_number }}
          path: |
            farda-app/build/ios/ipa/*.ipa
            farda-app/build/ios/archive/Runner.xcarchive
            farda-app/build/release-evidence/ios.json
          if-no-files-found: error
          retention-days: 14
