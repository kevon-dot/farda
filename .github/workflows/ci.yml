name: CI

on:
  push:
    branches: ['**']
  pull_request:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend-main:
    name: Main API (build, migrations, tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farda_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/farda_test_ci
      TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/farda_test_ci
      FARDA_VOICE_ENABLED: 'false'
    defaults:
      run:
        working-directory: farda-app-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: farda-app-backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Generate database client
        run: pnpm exec prisma generate
      - name: Apply migrations to disposable database
        run: pnpm exec prisma migrate deploy
      - name: Compile the API
        run: pnpm build
      - name: Run unit and database tests
        run: pnpm test

  backend-vial:
    name: Vial API (tests)
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: farda_test_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 12
    env:
      VIAL_TEST_MONGODB_URI: mongodb://127.0.0.1:27017/farda_test_ci?replicaSet=rs0
      VIAL_TEST_DATABASE_URL: postgresql://postgres:postgres@127.0.0.1:5432/farda_test_ci
    defaults:
      run:
        working-directory: smart-vial-backend
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: pnpm/action-setup@fc06bc1257f339d1d5d8b3a19a8cae5388b55320 # v4.4.0
        with:
          version: 11.25.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: smart-vial-backend/pnpm-lock.yaml
      - name: Install dependencies
        run: pnpm install --frozen-lockfile --ignore-scripts
      - name: Start a disposable MongoDB replica set
        # The image owns its fresh data directories as mongodb. Start as that
        # user so mongosh readiness probes cannot race a root entrypoint chown
        # over their short-lived config lock files in /data/db.
        run: |
          docker run --detach --user mongodb --name farda-test-mongo \
            --publish 127.0.0.1:27017:27017 mongo:7.0 \
            --replSet rs0 --bind_ip_all
          for attempt in $(seq 1 30); do
            if docker exec farda-test-mongo mongosh --quiet --eval 'db.adminCommand({ping: 1})'; then break; fi
            sleep 1
          done
          docker exec farda-test-mongo mongosh --quiet --eval \
            'rs.initiate({_id: "rs0", members: [{_id: 0, host: "127.0.0.1:27017"}]})'
          for attempt in $(seq 1 30); do
            if docker exec farda-test-mongo mongosh --quiet --eval 'quit(db.hello().isWritablePrimary ? 0 : 1)'; then exit 0; fi
            sleep 1
          done
          exit 1
      - name: Run unit and transaction tests
        run: pnpm test
      - name: MongoDB diagnostics on failure
        if: failure()
        run: docker logs farda-test-mongo

  mobile-app:
    name: Mobile app (analysis, tests, Android build)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: farda-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - uses: actions/setup-java@cf277c60eb25467037889841efdb72551f06f6c3 # v4.9.1
        with:
          distribution: temurin
          java-version: '17'
      - name: Materialize env asset files
        # pubspec.yaml declares .env.* as bundled assets. Real env files are
        # gitignored (they may hold secrets), so generate non-secret copies
        # from the committed example before building the asset bundle.
        run: |
          cp .env.example .env.development
          cp .env.example .env.staging
          cp .env.example .env.production
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Analyze application
        run: flutter analyze --no-fatal-infos
      - name: Run unit tests
        run: flutter test
      - name: Build Android review APK
        run: flutter build apk --debug --dart-define=FARDA_DEMO=true
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farda-android-review
          path: farda-app/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error

  mobile-ios:
    name: iOS app and Live Activity (unsigned simulator build)
    runs-on: macos-15
    defaults:
      run:
        working-directory: farda-app
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: subosito/flutter-action@1508160852fb97248640997f7cfb38da241df0ba # v2.9.1
        with:
          channel: stable
          flutter-version: '3.47.7'
          cache: true
      - name: Materialize public configuration placeholders
        run: |
          cp .env.example .env.development
          cp .env.example .env.staging
          cp .env.example .env.production
      - name: Install dependencies
        run: flutter pub get --enforce-lockfile
      - name: Validate native release configuration
        run: |
          python3 ios/scripts/validate_live_activity_project.py
          python3 ios/scripts/test_configure_release.py
      - name: Build app and embedded Live Activity extension
        run: flutter build ios --simulator --debug --no-codesign
      - name: Package simulator app for review
        run: ditto -c -k --sequesterRsrc --keepParent build/ios/iphonesimulator/Runner.app build/ios/farda-simulator.zip
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: farda-ios-simulator-review
          path: farda-app/build/ios/farda-simulator.zip
          if-no-files-found: error

  consumer-prototype:
    name: Consumer prototype state transitions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '22'
      - run: node --test prototypes/consumer-v2/mock.test.mjs
